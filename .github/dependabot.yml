version: 2
updates:
  # Maintain Python dependencies defined in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # Maintain Docker base images in Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
